services:
  - type: web
    name: relay-room
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: ROOM_PASSWORD
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: TRUST_PROXY
        value: "1"
